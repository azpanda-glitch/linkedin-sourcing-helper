<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Sourcing Helper</h1>
    <a id="settings-link" href="#" title="Settings">⚙︎</a>
  </header>

  <div id="status" class="status"></div>

  <section id="posting" hidden>
    <div class="meta">
      <div id="job-title" class="job-title"></div>
      <div id="job-company" class="muted"></div>
    </div>

    <label class="field-label" for="role">Role <span class="badge">searched as a phrase</span></label>
    <input id="role" type="text" spellcheck="false" placeholder="e.g. Software Engineer Intern" />

    <label class="field-label" for="company">Company <span class="badge">used in all searches</span></label>
    <input id="company" type="text" spellcheck="false" placeholder="e.g. Amazon" />

    <div id="detect" class="muted"></div>

    <label class="field-label" for="boolean">LinkedIn keywords <span id="src-badge" class="badge"></span></label>
    <textarea id="boolean" rows="3" spellcheck="false"></textarea>
    <div class="row">
      <button id="rebuild" class="secondary">Rebuild links</button>
      <button id="copy-bool" class="secondary">Copy</button>
    </div>

    <h2>Hiring manager posts</h2>
    <ul id="hm-links" class="links"></ul>

    <h2>Recruiters & people</h2>
    <ul id="sourcer-links" class="links"></ul>

    <h2>Live people search (People Data Labs)</h2>
    <div class="row">
      <button id="find-recruiters" class="secondary">Find recruiters / hiring mgrs</button>
      <button id="find-peers" class="secondary">Find people in this role</button>
    </div>
    <div id="pdl-status" class="muted"></div>
    <button id="find-all-emails" class="secondary" hidden>Find all emails</button>
    <ul id="pdl-results" class="results"></ul>

    <h2>Find an email</h2>
    <label class="field-label" for="lookup-name">Name</label>
    <input id="lookup-name" type="text" spellcheck="false" placeholder="e.g. Jane Doe" />
    <label class="field-label" for="lookup-domain">Company email domain <span class="badge">optional</span></label>
    <input id="lookup-domain" type="text" spellcheck="false" placeholder="e.g. stripe.com" />
    <label class="field-label" for="lookup-linkedin">LinkedIn URL <span class="badge">optional</span></label>
    <input id="lookup-linkedin" type="text" spellcheck="false" placeholder="linkedin.com/in/…" />
    <div class="row"><button id="lookup-go">Find email</button></div>
    <div id="lookup-result"></div>

    <h2>Saved contacts <span id="contact-count" class="badge">0</span></h2>
    <ul id="contacts" class="contacts"></ul>
    <div class="row">
      <button id="copy-sheets" class="secondary">Copy for Sheets</button>
      <button id="export-csv" class="secondary">Export CSV</button>
      <button id="clear-contacts" class="secondary">Clear</button>
    </div>
    <div id="contacts-status" class="muted"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
